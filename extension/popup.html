<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.png" alt="OpenGrammarly">
    <span class="title">OpenGrammarly</span>
  </div>
  <div class="status">
    <span class="dot"></span>
    <span>Local Engine Connected</span>
  </div>
  <p class="desc">
    Checking text across all websites automatically. Powered by your local offline LanguageTool server.
  </p>
</body>
</html>
